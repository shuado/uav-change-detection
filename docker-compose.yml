version: '3.8'

services:
  # API服务
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # 命令行工具（用于运行检测任务）
  detect:
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: ["python3", "detect.py"]
    profiles:
      - tools
